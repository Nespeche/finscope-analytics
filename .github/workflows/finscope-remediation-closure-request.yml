name: FinScope B20 r3 Derived Materializer

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/finscope-remediation-closure-request.yml

concurrency:
  group: finscope-b20-r3-derived-materializer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize-derived:
    name: materialize-derived
    if: >-
      github.repository == 'Nespeche/finscope-analytics' &&
      github.event.pull_request.number == 46 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'maintenance/b20-post-restore-control-plane-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact correction HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Authenticate owner-authored commit, PR and exact remote HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)" = "$EVENT_HEAD"
          node --input-type=module <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const commitResponse = await fetch(`https://api.github.com/repos/Nespeche/finscope-analytics/commits/${process.env.EVENT_HEAD}`, { headers });
          if (!commitResponse.ok) throw new Error(`COMMIT_LOOKUP_FAILED:${commitResponse.status}`);
          const commit = await commitResponse.json();
          const prResponse = await fetch('https://api.github.com/repos/Nespeche/finscope-analytics/pulls/46', { headers });
          if (!prResponse.ok) throw new Error(`PR_LOOKUP_FAILED:${prResponse.status}`);
          const pr = await prResponse.json();
          const assert = (value, code) => { if (!value) throw new Error(code); };
          assert(commit.author?.login === 'Nespeche', 'COMMIT_NOT_OWNER_AUTHORED');
          assert(pr.state === 'open' && pr.draft === true, 'PR_NOT_OPEN_DRAFT');
          assert(pr.base?.ref === 'main' && pr.head?.ref === 'maintenance/b20-post-restore-control-plane-hardening', 'PR_REF_MISMATCH');
          assert(pr.head?.repo?.full_name === 'Nespeche/finscope-analytics', 'PR_HEAD_REPOSITORY_MISMATCH');
          assert(pr.head?.sha === process.env.EVENT_HEAD, 'REMOTE_HEAD_CHANGED');
          assert(!(pr.body ?? '').includes('B20_CLOSURE_BINDING_JSON_BEGIN'), 'CLOSURE_BINDING_PRESENT');
          assert(!(pr.body ?? '').split(/\r?\n/u).some((line) => line.trim() === 'AUTHORIZE_B20_POST_RESTORE_CLOSURE_COMMIT'), 'CLOSURE_LITERAL_PRESENT');
          NODE
      - name: Restore final workflow bytes in worktree and regenerate derivatives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const response = await fetch('https://api.github.com/repos/Nespeche/finscope-analytics/git/blobs/c5b35476215906db267253251fee962099688af1', {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
          });
          if (!response.ok) throw new Error(`FINAL_WORKFLOW_BLOB_FETCH_FAILED:${response.status}`);
          const payload = await response.json();
          const bytes = Buffer.from(String(payload.content).replace(/\s/gu, ''), 'base64');
          const digest = createHash('sha256').update(bytes).digest('hex');
          if (digest !== '61b76dd8e2fcdfc9f54292bfc73e618b74a67e9dff46c8f3df7360dd6966a8ab') throw new Error(`FINAL_WORKFLOW_DIGEST_MISMATCH:${digest}`);
          await writeFile('.github/workflows/finscope-remediation-closure-request.yml', bytes);
          NODE
          node implementation-control/scripts/Package-GitHubCompletedRelease.mjs --write-derived
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const inventory = JSON.parse(readFileSync('PACKAGE_INVENTORY.json', 'utf8'));
          const paths = new Set(inventory.files.map((item) => item.path));
          if (inventory.itemCount !== 823 || inventory.files.length !== 823) throw new Error(`R3_INVENTORY_COUNT_INVALID:${inventory.itemCount}/${inventory.files.length}`);
          if (!paths.has('.github/workflows/finscope-remediation-closure-request.yml')) throw new Error('CLOSURE_WORKFLOW_MISSING_FROM_INVENTORY');
          if (!paths.has('implementation-control/scripts/Apply-B20PostRestoreClosure.mjs')) throw new Error('APPLY_SCRIPT_MISSING_FROM_INVENTORY');
          NODE
      - name: Enforce workflow plus three derived worktree paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/finscope-remediation-closure-request.yml
            FILE_MANIFEST.sha256
            PACKAGE_INVENTORY.json
            PACKAGE_METADATA.json
          )
          test "${#actual[@]}" -eq 4
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check
      - name: Commit only three derived files with force-with-lease
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)" = "$EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PACKAGE_METADATA.json PACKAGE_INVENTORY.json FILE_MANIFEST.sha256
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m "fix(control-plane): rematerialize B20 r3 tracked derivatives"
          test "$(git rev-parse HEAD^)" = "$EVENT_HEAD"
          git push origin \
            "HEAD:refs/heads/maintenance/b20-post-restore-control-plane-hardening" \
            "--force-with-lease=refs/heads/maintenance/b20-post-restore-control-plane-hardening:$EVENT_HEAD"
