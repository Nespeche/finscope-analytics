name: FinScope Remediation Closure Request

on:
  pull_request:
    types: [edited]
    branches: [main]

concurrency:
  group: finscope-b20-post-restore-closure-request-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  # B20_CANDIDATE_BOOTSTRAP_JOB_BEGIN
  materialize-candidate-derived:
    name: materialize-candidate-derived
    if: >-
      github.repository == 'Nespeche/finscope-analytics' &&
      github.event.pull_request.number == 46 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'maintenance/b20-post-restore-control-plane-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.actor == github.repository_owner &&
      !contains(github.event.pull_request.body || '', 'AUTHORIZE_B20_POST_RESTORE_CLOSURE_COMMIT') &&
      !contains(github.event.pull_request.body || '', 'AUTHORIZE_B20_HARDENING_DERIVED_COMMIT') &&
      !contains(github.event.pull_request.body || '', 'AUTHORIZE_B20_POST_RESTORE_TAG_RELEASE')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate construction HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Finalize candidate identity and remove construction job
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          cat \
            README.md \
            START_HERE_CHATGPT.md \
            DOCUMENTATION_INDEX.md \
            V0.21_PHASE_STATUS.md \
            PROMPT_IMPLEMENTACION_B21.md \
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt \
            PACKAGE_METADATA.json \
            > "$RUNNER_TEMP/b20-candidate-payload.b64"
          base64 --decode "$RUNNER_TEMP/b20-candidate-payload.b64" > "$RUNNER_TEMP/b20-candidate-payload.tar.xz"
          echo "c96933b2a1e71d96a29a7d2de5edecea2a32ac42161318b18cdfc56a6d6865aa  $RUNNER_TEMP/b20-candidate-payload.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/b20-candidate-payload.tar.xz" -C .
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const workflowPath = '.github/workflows/finscope-remediation-closure-request.yml';
          const begin = '  # B20_CANDIDATE_BOOTSTRAP_JOB_BEGIN\\n';
          const end = '  # B20_CANDIDATE_BOOTSTRAP_JOB_END\\n';
          let workflow = readFileSync(workflowPath, 'utf8');
          const start = workflow.indexOf(begin);
          const finish = workflow.indexOf(end);
          if (start < 0 || finish < start) throw new Error('BOOTSTRAP_MARKERS_MISSING');
          workflow = `${workflow.slice(0, start)}${workflow.slice(finish + end.length)}`;
          writeFileSync(workflowPath, workflow, 'utf8');
          const metadataPath = 'PACKAGE_METADATA.json';
          const metadata = JSON.parse(readFileSync(metadataPath, 'utf8'));
          metadata.packageId = 'FinScope-Analytics-0.21.25-B20-completed-r3';
          metadata.logicalZipName = 'FS_v0.21.25_B20_completed_r3.zip';
          metadata.finalSha256Sidecar = 'FS_v0.21.25_B20_completed_r3.zip.sha256';
          metadata.remediationOperation = { id: 'b20-post-restore-control-plane-hardening', stage: 'candidate', scopeExpansion: 'CLOSURE_SCOPE_EXPANSION_REQUIRED', closureAuthorized: false };
          metadata.releaseRevision = 'v0.21.25_B20_completed_r3';
          metadata.identityModel = { packageAuthority: 'v0.21.25_B20_completed', releaseRevision: 'v0.21.25_B20_completed_r3', reservedTag: 'v0.21.25-B20-completed-r3', logicalZipName: 'FS_v0.21.25_B20_completed_r3.zip', sidecarName: 'FS_v0.21.25_B20_completed_r3.zip.sha256', promotable: false, replacesSources: false };
          writeFileSync(metadataPath, `${JSON.stringify(metadata)}\\n`, 'utf8');
          NODE
          node implementation-control/scripts/Package-GitHubCompletedRelease.mjs --write-derived
      - name: Enforce exact candidate materialization diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/finscope-remediation-closure-request.yml
            DOCUMENTATION_INDEX.md
            FILE_MANIFEST.sha256
            PACKAGE_INVENTORY.json
            PACKAGE_METADATA.json
            PROMPT_IMPLEMENTACION_B21.md
            README.md
            START_HERE_CHATGPT.md
            V0.21_PHASE_STATUS.md
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt
            implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
            implementation-control/scripts/Package-GitHubCompletedRelease.mjs
            implementation-control/scripts/Validate-ControlPlaneState.mjs
            implementation-control/scripts/Verify-GitHubClosure.mjs
            implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
            implementation-control/scripts/Verify-GitHubCompletedPackage.mjs
          )
          test "${#actual[@]}" -eq 16
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --check
      - name: Recheck remote HEAD and commit derived candidate files
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)"
          test "$remote_head" = "$EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/finscope-remediation-closure-request.yml \
            README.md START_HERE_CHATGPT.md DOCUMENTATION_INDEX.md V0.21_PHASE_STATUS.md PROMPT_IMPLEMENTACION_B21.md \
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt \
            implementation-control/scripts/Apply-B20PostRestoreClosure.mjs \
            implementation-control/scripts/Package-GitHubCompletedRelease.mjs \
            implementation-control/scripts/Validate-ControlPlaneState.mjs \
            implementation-control/scripts/Verify-GitHubClosure.mjs \
            implementation-control/scripts/Verify-GitHubClosureArtifact.mjs \
            implementation-control/scripts/Verify-GitHubCompletedPackage.mjs \
            PACKAGE_METADATA.json PACKAGE_INVENTORY.json FILE_MANIFEST.sha256
          git commit -m "chore: materialize B20 closure mechanism candidate r3"
          test "$(git rev-parse HEAD^)" = "$EVENT_HEAD"
          git push origin "HEAD:refs/heads/maintenance/b20-post-restore-control-plane-hardening" "--force-with-lease=refs/heads/maintenance/b20-post-restore-control-plane-hardening:$EVENT_HEAD"
  # B20_CANDIDATE_BOOTSTRAP_JOB_END
  materialize-closure:
    name: materialize-closure
    if: >-
      github.repository == 'Nespeche/finscope-analytics' &&
      github.event.pull_request.number == 46 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'maintenance/b20-post-restore-control-plane-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.actor == github.repository_owner &&
      contains(github.event.pull_request.body || '', 'AUTHORIZE_B20_POST_RESTORE_CLOSURE_COMMIT')
    runs-on: ubuntu-latest
    steps:
      - name: Capture authenticated event identity
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Nespeche/finscope-analytics"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "${{ github.event.pull_request.number }}" = "46"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.head.ref }}" = "maintenance/b20-post-restore-control-plane-hardening"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.state }}" = "open"
          test "${{ github.event.pull_request.draft }}" = "true"
          test "$EVENT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const assert = (value, code) => { if (!value) throw new Error(code); };
          assert(event.repository?.full_name === 'Nespeche/finscope-analytics', 'EVENT_REPOSITORY_MISMATCH');
          assert(event.pull_request?.number === 46, 'EVENT_PR_NUMBER_MISMATCH');
          assert(event.pull_request?.head?.sha === process.env.EVENT_HEAD, 'EVENT_HEAD_MISMATCH');
          writeFileSync(`${process.env.RUNNER_TEMP}/pr-body.md`, event.pull_request?.body ?? '', 'utf8');
          writeFileSync(`${process.env.RUNNER_TEMP}/event-head.txt`, process.env.EVENT_HEAD, 'utf8');
          NODE
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Reauthenticate PR and remote HEAD before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const token = process.env.GH_TOKEN;
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const response = await fetch('https://api.github.com/repos/Nespeche/finscope-analytics/pulls/46', {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
          });
          if (!response.ok) throw new Error(`PR_LOOKUP_FAILED:${response.status}`);
          const pr = await response.json();
          const assert = (value, code) => { if (!value) throw new Error(code); };
          assert(pr.state === 'open', 'PR_NOT_OPEN');
          assert(pr.draft === true, 'PR_NOT_DRAFT');
          assert(pr.number === 46, 'PR_NUMBER_MISMATCH');
          assert(pr.base?.ref === 'main', 'PR_BASE_MISMATCH');
          assert(pr.head?.ref === 'maintenance/b20-post-restore-control-plane-hardening', 'PR_BRANCH_MISMATCH');
          assert(pr.head?.repo?.full_name === 'Nespeche/finscope-analytics', 'PR_HEAD_REPOSITORY_MISMATCH');
          assert(pr.head?.sha === process.env.EVENT_HEAD, 'REMOTE_HEAD_CHANGED');
          assert((pr.body ?? '') === (event.pull_request?.body ?? ''), 'PR_BODY_CHANGED_AFTER_EVENT');
          NODE
      - name: Validate contract and produce deterministic dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          node implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
          --dry-run --verify-remote
          --pr-body-file "$RUNNER_TEMP/pr-body.md"
          --output "$RUNNER_TEMP/closure-dry-run"
      - name: Materialize exactly ten closure paths
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          node implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
          --apply --verify-remote
          --pr-body-file "$RUNNER_TEMP/pr-body.md"
      - name: Enforce exact non-executable atomic diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          expected=(
            DOCUMENTATION_INDEX.md
            FILE_MANIFEST.sha256
            PACKAGE_INVENTORY.json
            PACKAGE_METADATA.json
            PROMPT_IMPLEMENTACION_B21.md
            README.md
            START_HERE_CHATGPT.md
            V0.21_PHASE_STATUS.md
            implementation-control/GITHUB_HANDOFF.json
            implementation-control/IMPLEMENTATION_STATE.json
          )
          test "${#actual[@]}" -eq 10
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          test -n "$(git diff --stat)"
          git diff --check
      - name: Recheck remote HEAD and create one atomic commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)"
          test "$remote_head" = "$EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md START_HERE_CHATGPT.md DOCUMENTATION_INDEX.md V0.21_PHASE_STATUS.md \
            PACKAGE_METADATA.json PACKAGE_INVENTORY.json FILE_MANIFEST.sha256 PROMPT_IMPLEMENTACION_B21.md \
            implementation-control/GITHUB_HANDOFF.json implementation-control/IMPLEMENTATION_STATE.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "10"
          git commit -m "chore: request authenticated B20 post-restore closure"
          test "$(git rev-parse HEAD^)" = "$EVENT_HEAD"
          git push origin \
            "HEAD:refs/heads/maintenance/b20-post-restore-control-plane-hardening" \
            "--force-with-lease=refs/heads/maintenance/b20-post-restore-control-plane-hardening:$EVENT_HEAD"
