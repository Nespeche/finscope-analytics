name: FinScope B20 r3 Data Materializer

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/finscope-remediation-closure-request.yml

concurrency:
  group: finscope-b20-r3-data-materializer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize-candidate-data:
    name: materialize-candidate-data
    if: >-
      github.repository == 'Nespeche/finscope-analytics' &&
      github.event.pull_request.number == 46 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'maintenance/b20-post-restore-control-plane-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact construction HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Authenticate owner-authored commit, PR and exact remote HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Nespeche/finscope-analytics"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)" = "$EVENT_HEAD"
          node --input-type=module <<'NODE'
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const commitResponse = await fetch(`https://api.github.com/repos/Nespeche/finscope-analytics/commits/${process.env.EVENT_HEAD}`, { headers });
          if (!commitResponse.ok) throw new Error(`COMMIT_LOOKUP_FAILED:${commitResponse.status}`);
          const commit = await commitResponse.json();
          const response = await fetch('https://api.github.com/repos/Nespeche/finscope-analytics/pulls/46', { headers });
          if (!response.ok) throw new Error(`PR_LOOKUP_FAILED:${response.status}`);
          const pr = await response.json();
          const assert = (value, code) => { if (!value) throw new Error(code); };
          assert(commit.author?.login === 'Nespeche', 'COMMIT_NOT_OWNER_AUTHORED');
          assert(commit.sha === process.env.EVENT_HEAD, 'COMMIT_SHA_MISMATCH');
          assert(pr.state === 'open' && pr.draft === true, 'PR_NOT_OPEN_DRAFT');
          assert(pr.number === 46 && pr.base?.ref === 'main', 'PR_IDENTITY_MISMATCH');
          assert(pr.head?.ref === 'maintenance/b20-post-restore-control-plane-hardening', 'PR_BRANCH_MISMATCH');
          assert(pr.head?.repo?.full_name === 'Nespeche/finscope-analytics', 'PR_HEAD_REPOSITORY_MISMATCH');
          assert(pr.head?.sha === process.env.EVENT_HEAD, 'REMOTE_HEAD_CHANGED');
          assert(!(pr.body ?? '').includes('B20_CLOSURE_BINDING_JSON_BEGIN'), 'CLOSURE_BINDING_PRESENT');
          assert(!(pr.body ?? '').split(/\r?\n/u).some((line) => line.trim() === 'AUTHORIZE_B20_POST_RESTORE_CLOSURE_COMMIT'), 'CLOSURE_LITERAL_PRESENT');
          NODE
      - name: Reconstruct and authenticate final non-workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          cat \
            README.md \
            START_HERE_CHATGPT.md \
            DOCUMENTATION_INDEX.md \
            V0.21_PHASE_STATUS.md \
            PROMPT_IMPLEMENTACION_B21.md \
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt \
            PACKAGE_METADATA.json \
            > "$RUNNER_TEMP/b20-candidate-payload.b64"
          base64 --decode "$RUNNER_TEMP/b20-candidate-payload.b64" > "$RUNNER_TEMP/b20-candidate-payload.tar.xz"
          echo "c96933b2a1e71d96a29a7d2de5edecea2a32ac42161318b18cdfc56a6d6865aa  $RUNNER_TEMP/b20-candidate-payload.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/b20-candidate-payload.tar.xz" -C .
          node implementation-control/scripts/Package-GitHubCompletedRelease.mjs --write-derived
      - name: Enforce allowlisted non-empty data diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only | LC_ALL=C sort)
          allowed=(
            DOCUMENTATION_INDEX.md
            FILE_MANIFEST.sha256
            PACKAGE_INVENTORY.json
            PACKAGE_METADATA.json
            PROMPT_IMPLEMENTACION_B21.md
            README.md
            START_HERE_CHATGPT.md
            V0.21_PHASE_STATUS.md
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt
            implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
            implementation-control/scripts/Package-GitHubCompletedRelease.mjs
            implementation-control/scripts/Validate-ControlPlaneState.mjs
            implementation-control/scripts/Verify-GitHubClosure.mjs
            implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
            implementation-control/scripts/Verify-GitHubCompletedPackage.mjs
          )
          test "${#actual[@]}" -gt 0
          test "${#actual[@]}" -le "${#allowed[@]}"
          printf '%s\n' "${actual[@]}"
          for path in "${actual[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fqx -- "$path"
          done
          git diff --check
      - name: Commit data candidate with force-with-lease
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/maintenance/b20-post-restore-control-plane-hardening | cut -f1)" = "$EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md START_HERE_CHATGPT.md DOCUMENTATION_INDEX.md V0.21_PHASE_STATUS.md PROMPT_IMPLEMENTACION_B21.md \
            implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt \
            implementation-control/scripts/Apply-B20PostRestoreClosure.mjs \
            implementation-control/scripts/Package-GitHubCompletedRelease.mjs \
            implementation-control/scripts/Validate-ControlPlaneState.mjs \
            implementation-control/scripts/Verify-GitHubClosure.mjs \
            implementation-control/scripts/Verify-GitHubClosureArtifact.mjs \
            implementation-control/scripts/Verify-GitHubCompletedPackage.mjs \
            PACKAGE_METADATA.json PACKAGE_INVENTORY.json FILE_MANIFEST.sha256
          staged_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$staged_count" -gt 0
          test "$staged_count" -le 15
          git commit -m "fix(control-plane): materialize B20 r3 candidate data"
          test "$(git rev-parse HEAD^)" = "$EVENT_HEAD"
          git push origin \
            "HEAD:refs/heads/maintenance/b20-post-restore-control-plane-hardening" \
            "--force-with-lease=refs/heads/maintenance/b20-post-restore-control-plane-hardening:$EVENT_HEAD"
