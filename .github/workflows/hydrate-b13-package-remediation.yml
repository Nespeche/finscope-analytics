name: Clean B13 remediation transport

on:
  push:
    branches: [agent/b13-package-metadata-remediation]
    paths:
      - .github/workflows/hydrate-b13-package-remediation.yml
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: clean-b13-remediation-transport
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name == 'push' || github.head_ref == 'agent/b13-package-metadata-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/b13-package-metadata-remediation
      - name: Remove temporary authenticated transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/remediation
          rm -f .github/workflows/hydrate-b13-package-remediation.yml
          git config user.name "FinScope Release Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(b13): remove authenticated remediation transport"
          git push origin HEAD:agent/b13-package-metadata-remediation
