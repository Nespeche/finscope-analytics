name: FinScope Release Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finscope-completed-release.yml
      - .github/workflows/finscope-release-qualification.yml
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - implementation-control/scripts/Run-GitHubReleaseTransfer.mjs
      - implementation-control/scripts/Verify-GitHubBaseline.mjs
      - implementation-control/scripts/Package-GitHubCompletedRelease.mjs
      - implementation-control/scripts/Finalize-GitHubReleaseHandoff.mjs
      - implementation-control/schemas/github-validation-evidence.schema.json
      - implementation-control/schemas/github-release-handoff.schema.json

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  qualify-release:
    name: qualify-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Classify Release remediation
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          kind=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).operation.kind")
          test "$kind" = RELEASE_REMEDIATION && enabled=true || enabled=false
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          test "$enabled" = true || echo "Release qualification is not applicable to operation kind: $kind"
      - name: Configure Node from package authority
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
      - name: Prepare qualification workspace
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Verify remediation authority and control plane
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          handoff=implementation-control/GITHUB_HANDOFF.json
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.kind")" = RELEASE_REMEDIATION
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.branch")" = "$GITHUB_HEAD_REF"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).release.pending")" = true
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).closure.status")" = COMPLETED
          node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Authenticate completed baseline
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-release/qualification-baseline.json
      - name: Execute full Release qualification commands
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: Package completed baseline
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Package-GitHubCompletedRelease.mjs .finscope-release
      - name: Authenticate closure artifact contents
        if: steps.mode.outputs.enabled == 'true'
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - name: Qualify temporary Release transfer
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs qualify .finscope-release
      - name: Upload qualification evidence
        if: always() && steps.mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finscope-release-qualification-${{ github.event.pull_request.head.sha }}
          path: .finscope-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
