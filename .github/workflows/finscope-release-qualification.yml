name: FinScope Release Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finscope-completed-release.yml
      - .github/workflows/finscope-release-qualification.yml
      - V0.21_PHASE_STATUS.md
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/scripts/Apply-GitHubBatchClosure.mjs
      - implementation-control/scripts/Package-GitHubCompletedRelease.mjs
      - implementation-control/scripts/Verify-GitHubCompletedPackage.mjs
      - implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - implementation-control/scripts/Run-GitHubReleaseTransfer.mjs
      - implementation-control/scripts/Verify-GitHubBaseline.mjs
      - implementation-control/scripts/Finalize-GitHubReleaseHandoff.mjs
      - implementation-control/schemas/github-validation-evidence.schema.json
      - implementation-control/schemas/github-release-handoff.schema.json

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  qualify-release:
    name: qualify-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Classify Release remediation
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          kind=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).operation.kind")
          test "$kind" = RELEASE_REMEDIATION && enabled=true || enabled=false
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          test "$enabled" = true || echo "Release qualification is not applicable to operation kind: $kind"
      - name: Configure Node from package authority
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
      - name: Prepare qualification workspace
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Verify remediation authority, allowlist and control plane
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          handoff=implementation-control/GITHUB_HANDOFF.json
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.kind")" = RELEASE_REMEDIATION
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.branch")" = "$GITHUB_HEAD_REF"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).release.pending")" = true
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).closure.status")" = COMPLETED
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/finscope-completed-release.yml|\
              .github/workflows/finscope-release-qualification.yml|\
              V0.21_PHASE_STATUS.md|\
              implementation-control/GITHUB_HANDOFF.json|\
              implementation-control/scripts/Apply-GitHubBatchClosure.mjs|\
              implementation-control/scripts/Package-GitHubCompletedRelease.mjs|\
              implementation-control/scripts/Verify-GitHubCompletedPackage.mjs|\
              implementation-control/scripts/Run-GitHubReleaseTransfer.mjs) ;;
              *) echo "B13 metadata remediation allowlist violation: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")
          node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Authenticate completed baseline
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-release/qualification-baseline.json
      - name: Execute literal Release qualification commands
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            command=$(printf '%s' "$encoded" | base64 --decode)
            printf 'Executing literal qualification command: %s\n' "$command"
            bash -lc "$command"
          done < <(node -e "const h=require('./implementation-control/GITHUB_HANDOFF.json'); for (const item of h.operation.qualificationCommands.filter((entry)=>entry.required)) console.log(Buffer.from(item.command).toString('base64'))")
      - name: Authenticate closure artifact contents
        if: steps.mode.outputs.enabled == 'true' && github.head_ref != 'audit/b17-release-reauthentication'
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - name: Authenticate historical B17 closure artifact
        if: steps.mode.outputs.enabled == 'true' && github.head_ref == 'audit/b17-release-reauthentication'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { join, normalize, resolve, sep } from 'node:path';

          const repo = 'Nespeche/finscope-analytics';
          const requestSha = '6d8b99fb397eb4d545ad645fecb79121c72b5d08';
          const closureSha = '933b7e476f2130a7e77502882e453eda93e8326b';
          const candidateSha = '244ee6a50f8eebdeb2d1c76bab599e3c79ec4abe';
          const closureRunId = '30714160143';
          const closureArtifactId = 8822805360;
          const closureArtifactName = 'finscope-closure-933b7e476f21-PASS';
          const closureArtifactDigest = '26bb5ec526913214f58a35e4bd1e8d27642d7da60d714620eb79db5ec8c43e95';
          const candidateArtifactDigest = 'a26bdefd2ba3808d8e621902cee78953a3a3d3a650be31d5bb8333bb25449ffa';
          const specifyHash = 'e06c8fbab523b824c144bb22b616001a3a4e810bb9daaa793e84d5cbb77c2c09';
          const auditRoot = join('.finscope-release', '.historical-b17-closure');
          const zipPath = join(auditRoot, 'closure-artifact.zip');
          const extractRoot = join(auditRoot, 'extracted');

          function fail(code, detail = '') { throw new Error(code + (detail ? ':' + detail : '')); }
          function assert(condition, code, detail = '') { if (!condition) fail(code, detail); }
          function sha256(bytes) { return createHash('sha256').update(bytes).digest('hex'); }
          function readJson(path) { return JSON.parse(readFileSync(path, 'utf8')); }
          function apiJson(path) {
            return JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 }));
          }
          function safeRelative(path) {
            assert(typeof path === 'string' && path.length > 0, 'EMPTY_ARCHIVE_PATH');
            assert(!path.includes('\\') && !path.includes('\0'), 'UNSAFE_ARCHIVE_PATH', path);
            assert(!path.startsWith('/') && !/^[A-Za-z]:/u.test(path), 'ABSOLUTE_ARCHIVE_PATH', path);
            const normalized = normalize(path).replaceAll('\\', '/');
            assert(normalized !== '..' && !normalized.startsWith('../'), 'TRAVERSAL_ARCHIVE_PATH', path);
            return normalized;
          }
          function within(root, relative) {
            const absolute = resolve(root, relative);
            assert(absolute === resolve(root) || absolute.startsWith(resolve(root) + sep), 'PATH_ESCAPE', relative);
            return absolute;
          }
          function verifyManifest(root, manifestName) {
            const manifestPath = within(root, manifestName);
            const lines = readFileSync(manifestPath, 'utf8').trim().split(/\r?\n/u).filter(Boolean);
            assert(lines.length > 0, 'EMPTY_MANIFEST', manifestName);
            const seen = new Set();
            for (const line of lines) {
              const match = /^([0-9a-f]{64})  (.+)$/u.exec(line);
              assert(match, 'INVALID_MANIFEST_LINE', line);
              const relative = safeRelative(match[2]);
              assert(!seen.has(relative), 'DUPLICATE_MANIFEST_PATH', relative);
              seen.add(relative);
              const file = within(root, relative);
              assert(existsSync(file), 'MANIFEST_FILE_MISSING', relative);
              assert(sha256(readFileSync(file)) === match[1], 'MANIFEST_HASH_MISMATCH', relative);
            }
            return seen;
          }

          const run = apiJson('repos/' + repo + '/actions/runs/' + closureRunId);
          assert(String(run.id) === closureRunId && run.status === 'completed' && run.conclusion === 'success', 'CLOSURE_RUN_INVALID');
          assert(run.head_sha === requestSha && run.head_branch === 'agent/b17-consent-storage-export-preview' && run.event === 'pull_request', 'CLOSURE_RUN_IDENTITY_INVALID');
          const artifactList = apiJson('repos/' + repo + '/actions/runs/' + closureRunId + '/artifacts?per_page=100');
          const artifact = artifactList.artifacts?.find((item) => item.id === closureArtifactId);
          assert(artifact && artifact.name === closureArtifactName && artifact.expired === false, 'CLOSURE_ARTIFACT_REFERENCE_INVALID');
          assert(artifact.digest === 'sha256:' + closureArtifactDigest, 'CLOSURE_ARTIFACT_METADATA_DIGEST_INVALID');

          rmSync(auditRoot, { recursive: true, force: true });
          mkdirSync(auditRoot, { recursive: true });
          const zipBytes = execFileSync('gh', ['api', 'repos/' + repo + '/actions/artifacts/' + closureArtifactId + '/zip'], { maxBuffer: 20 * 1024 * 1024 });
          writeFileSync(zipPath, zipBytes);
          assert(sha256(zipBytes) === closureArtifactDigest, 'CLOSURE_ARTIFACT_DIGEST_MISMATCH');
          const entries = execFileSync('unzip', ['-Z1', zipPath], { encoding: 'utf8' }).split(/\r?\n/u).filter(Boolean);
          assert(entries.length === 25, 'CLOSURE_ARCHIVE_ENTRY_COUNT_INVALID', String(entries.length));
          const folded = new Set();
          for (const entry of entries) {
            const relative = safeRelative(entry);
            const foldedPath = relative.toLowerCase();
            assert(!folded.has(foldedPath), 'CLOSURE_ARCHIVE_CASE_COLLISION', relative);
            folded.add(foldedPath);
          }
          const zipInfo = execFileSync('zipinfo', ['-l', zipPath], { encoding: 'utf8' });
          assert(!/^l[rwx-]{9}\s/mu.test(zipInfo), 'CLOSURE_ARCHIVE_SYMLINK');
          mkdirSync(extractRoot, { recursive: true });
          execFileSync('unzip', ['-q', zipPath, '-d', extractRoot]);
          verifyManifest(extractRoot, 'EVIDENCE_MANIFEST.sha256');
          verifyManifest(join(extractRoot, 'candidate-artifact'), 'EVIDENCE_MANIFEST.sha256');
          assert(sha256(readFileSync(join(extractRoot, 'candidate-artifact.zip'))) === candidateArtifactDigest, 'EMBEDDED_CANDIDATE_DIGEST_MISMATCH');

          const closure = readJson(join(extractRoot, 'github-closure-evidence.json'));
          assert(closure.schemaVersion === '1.0.0' && closure.result === 'PASS' && closure.mode === 'BATCH_CLOSURE', 'CLOSURE_EVIDENCE_RESULT_INVALID');
          assert(closure.repository === repo && closure.operationId === 'B17' && closure.activeBatchId === 'B17', 'CLOSURE_EVIDENCE_SCOPE_INVALID');
          assert(closure.branch === 'agent/b17-consent-storage-export-preview' && closure.commitSha === closureSha, 'CLOSURE_EVIDENCE_COMMIT_INVALID');
          assert(closure.candidate?.sha === candidateSha && String(closure.candidate?.runId) === '30713946002', 'CLOSURE_CANDIDATE_REFERENCE_INVALID');
          assert(closure.candidate?.artifactId === 8822770890 && closure.candidate?.artifactName === 'finscope-github-validation-244ee6a50f8e-PASS', 'CLOSURE_CANDIDATE_ARTIFACT_INVALID');
          assert(closure.candidate?.artifactDigest === 'sha256:' + candidateArtifactDigest && closure.primaryFailure === null, 'CLOSURE_CANDIDATE_DIGEST_INVALID');
          const changedDetail = closure.details?.find((item) => item.code === 'CLOSURE_CHANGED_FILES')?.detail;
          assert(typeof changedDetail === 'string', 'CLOSURE_CHANGED_FILES_MISSING');
          const changed = JSON.parse(changedDetail);
          assert(Array.isArray(changed) && changed.length === 40 && new Set(changed).size === 40, 'CLOSURE_CHANGED_FILES_INVALID');
          const fixedAllowed = new Set([
            'DOCUMENTATION_INDEX.md', 'PACKAGE_METADATA.json', 'PROJECT_CONTEXT.md', 'START_HERE_CHATGPT.md', 'V0.21_PHASE_STATUS.md',
            'implementation-control/AUTHORITY_MATRIX.json', 'implementation-control/CHANGE_LEDGER.md', 'implementation-control/GITHUB_HANDOFF.json',
            'implementation-control/IMPLEMENTATION_BATCH_MAP.json', 'implementation-control/IMPLEMENTATION_BATCH_MAP.md',
            'implementation-control/IMPLEMENTATION_STATE.json', 'implementation-control/TASK_SOURCE_LOCK.json',
            'implementation-control/reports/B17_EVIDENCE_VERIFICATION_AND_CLOSURE.json',
            'implementation-control/reports/B17_EVIDENCE_VERIFICATION_AND_CLOSURE.md',
            'specs/001-fundamental-analysis-platform/tasks.md'
          ]);
          for (const path of changed) {
            const allowed = fixedAllowed.has(path) || /^implementation-control\/batches\/B(?:0[1-9]|1[0-9]|2[0-5])\.json$/u.test(path);
            assert(allowed && !path.startsWith('.specify/'), 'CLOSURE_ALLOWLIST_VIOLATION', path);
          }

          const candidate = readJson(join(extractRoot, 'candidate-artifact/github-validation-evidence.json'));
          assert(candidate.schemaVersion === '1.0.0' && candidate.result === 'PASS' && candidate.mode === 'BATCH', 'CANDIDATE_EVIDENCE_RESULT_INVALID');
          assert(candidate.repository === repo && candidate.branch === 'agent/b17-consent-storage-export-preview' && candidate.commitSha === candidateSha, 'CANDIDATE_IDENTITY_INVALID');
          assert(String(candidate.runId) === '30713946002' && candidate.activeBatchId === 'B17' && candidate.browserRequired === true, 'CANDIDATE_SCOPE_INVALID');
          const baseline = candidate.releaseBaseline;
          assert(baseline?.result === 'PASS' && baseline.tag === 'v0.21.19-B16-completed' && baseline.zipName === 'FS_v0.21.19_B16_completed.zip', 'CANDIDATE_BASELINE_IDENTITY_INVALID');
          assert(baseline.sidecarName === 'FS_v0.21.19_B16_completed.zip.sha256' && baseline.zipSha256 === '6553ce27b8c4d21ceab4967628debcba0ffc67c1b736d0d488f3c6fa36881bc0', 'CANDIDATE_BASELINE_HASH_INVALID');
          assert(baseline.root === 'FinScope_v0.21.4' && baseline.failure === null, 'CANDIDATE_BASELINE_ROOT_INVALID');
          assert(candidate.specify?.count === 19 && candidate.specify?.sha256 === specifyHash && candidate.specify?.expectedSha256 === specifyHash && candidate.specify?.byteIdentical === true, 'CANDIDATE_SPECIFY_INVALID');
          const expectedCommands = [
            'npm ci',
            'npm exec playwright install chromium',
            'npm run typecheck',
            'npm run test:unit -- tests/unit/persistence/export.test.ts',
            'npm run test:integration -- tests/integration/persistence/atomic-publication.test.ts tests/integration/persistence/price-repository.test.ts',
            'npm run test:negative -- tests/negative/persistence/restore-validation.test.ts',
            'npm run test:e2e -- tests/e2e/consent.spec.ts',
            'npm run test',
            'npm run test:browser',
            'npm run build'
          ];
          assert(candidate.derivedBatchCommands?.length === expectedCommands.length && candidate.executedCommands?.length === expectedCommands.length, 'CANDIDATE_COMMAND_COUNT_INVALID');
          for (let index = 0; index < expectedCommands.length; index += 1) {
            const expected = expectedCommands[index];
            const derived = candidate.derivedBatchCommands[index];
            const executed = candidate.executedCommands[index];
            assert(derived?.command === expected && derived?.required === true, 'DERIVED_COMMAND_INVALID', String(index));
            assert(executed?.command === expected && executed?.required === true && executed?.status === 'PASS' && executed?.exitCode === 0, 'EXECUTED_COMMAND_INVALID', String(index));
            assert(executed.discovery?.valid === true && executed.discovery?.skipped === 0 && executed.discovery?.pending === 0, 'COMMAND_DISCOVERY_INVALID', String(index));
          }
          const discovered = candidate.executedCommands.reduce((sum, item) => sum + item.discovery.discovered, 0);
          const passed = candidate.executedCommands.reduce((sum, item) => sum + item.discovery.passed, 0);
          assert(discovered === 544 && passed === 544 && candidate.primaryFailure === null, 'CANDIDATE_TEST_COUNTS_INVALID', discovered + '/' + passed);
          assert(candidate.selfTests?.length === 9 && candidate.selfTests.every((item) => item.result === 'PASS'), 'CANDIDATE_SELF_TEST_INVALID');

          const result = {
            schemaVersion: '1.0.0',
            result: 'PASS',
            mode: 'HISTORICAL_CLOSURE_REAUTHENTICATION',
            repository: repo,
            closureRunId,
            closureRunHeadSha: requestSha,
            closureCommitSha: closureSha,
            closureArtifactId,
            closureArtifactName,
            closureArtifactDigest: 'sha256:' + closureArtifactDigest,
            candidateSha,
            candidateArtifactDigest: 'sha256:' + candidateArtifactDigest,
            tests: { discovered, passed, failed: 0 },
            specify: { count: 19, sha256: specifyHash },
            checkedAt: new Date().toISOString()
          };
          writeFileSync(join('.finscope-release', 'HISTORICAL_CLOSURE_REAUTHENTICATION.json'), JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Qualify temporary Release transfer
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs qualify .finscope-release
      - name: Upload qualification evidence
        if: always() && steps.mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finscope-release-qualification-${{ github.event.pull_request.head.sha }}
          path: .finscope-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
