name: FinScope Release Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finscope-closure-validation.yml
      - .github/workflows/finscope-completed-release.yml
      - .github/workflows/finscope-release-qualification.yml
      - .github/workflows/finscope-remediation-materialize-derived.yml
      - README.md
      - START_HERE_CHATGPT.md
      - DOCUMENTATION_INDEX.md
      - V0.21_PHASE_STATUS.md
      - PACKAGE_METADATA.json
      - PACKAGE_INVENTORY.json
      - FILE_MANIFEST.sha256
      - PROMPT_IMPLEMENTACION_B21.md
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/IMPLEMENTATION_STATE.json
      - implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt
      - implementation-control/scripts/Package-GitHubCompletedRelease.mjs
      - implementation-control/scripts/Verify-GitHubCompletedPackage.mjs

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  qualify-release:
    name: qualify-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Verify remediation identity and exact allowlist
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const handoff = JSON.parse(readFileSync('implementation-control/GITHUB_HANDOFF.json', 'utf8'));
          const fail = (code, detail = '') => { throw new Error(`${code}${detail ? `:${detail}` : ''}`); };
          if (handoff.operation?.id !== 'b20-post-restore-control-plane-hardening') fail('UNEXPECTED_OPERATION');
          if (handoff.operation?.kind !== 'RELEASE_REMEDIATION') fail('UNEXPECTED_OPERATION_KIND');
          if (handoff.operation?.branch !== process.env.HEAD_BRANCH) fail('UNEXPECTED_OPERATION_BRANCH', process.env.HEAD_BRANCH);
          if (handoff.operation?.stage !== 'candidate') fail('UNEXPECTED_OPERATION_STAGE', handoff.operation?.stage);
          if (handoff.release?.pending !== true || handoff.release?.authorizationStatus !== 'NOT_AUTHORIZED') fail('RELEASE_GATE_NOT_CLOSED');
          if (handoff.remediation?.hold !== true) fail('RELEASE_RECOVERY_HOLD_MISSING');
          const allowed = new Set(handoff.remediation?.allowedPaths ?? []);
          const closureAllowed = handoff.remediation?.closurePolicy?.allowedPaths ?? [];
          for (const path of closureAllowed) if (!allowed.has(path)) fail('CLOSURE_PATH_OUTSIDE_REMEDIATION_ALLOWLIST', path);
          const changed = execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).trim().split(/\r?\n/u).filter(Boolean);
          const denied = changed.filter((path) => !allowed.has(path));
          if (denied.length > 0) fail('REMEDIATION_ALLOWLIST_VIOLATION', JSON.stringify(denied));
          console.log(JSON.stringify({ operation: handoff.operation.id, changed, allowed: [...allowed], mutation: false }, null, 2));
          NODE
      - name: Prepare qualification workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release .finscope-evidence/preflight
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Validate control plane
        run: node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Authenticate completed baseline Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-evidence/preflight/qualification-baseline.json
      - name: Generate exact-tree remediation candidate package
        run: node implementation-control/scripts/Package-GitHubCompletedRelease.mjs .finscope-release > .finscope-release/package.stdout.log 2> .finscope-release/package.stderr.log
      - name: Verify exact-tree remediation candidate package
        run: node implementation-control/scripts/Verify-GitHubCompletedPackage.mjs .finscope-release/FS_v0.21.25_B20_completed.zip .finscope-release/FS_v0.21.25_B20_completed.zip.sha256 > .finscope-release/verifier.stdout.log 2> .finscope-release/verifier.stderr.log
      - name: Upload read-only qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-release-qualification-${{ github.event.pull_request.head.sha }}
          path: |
            .finscope-release
            .finscope-evidence/preflight
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
