name: FinScope Release Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finscope-remediation-closure-request.yml
      - .github/workflows/finscope-closure-validation.yml
      - .github/workflows/finscope-completed-release.yml
      - .github/workflows/finscope-release-qualification.yml
      - README.md
      - START_HERE_CHATGPT.md
      - DOCUMENTATION_INDEX.md
      - V0.21_PHASE_STATUS.md
      - PACKAGE_METADATA.json
      - PACKAGE_INVENTORY.json
      - FILE_MANIFEST.sha256
      - PROMPT_IMPLEMENTACION_B21.md
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/IMPLEMENTATION_STATE.json
      - implementation-control/PROJECT_CONFIGURATION_INSTRUCTIONS.txt
      - implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
      - implementation-control/scripts/Verify-GitHubClosure.mjs
      - implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - implementation-control/scripts/Validate-ControlPlaneState.mjs
      - implementation-control/scripts/Package-GitHubCompletedRelease.mjs
      - implementation-control/scripts/Verify-GitHubCompletedPackage.mjs

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  qualify-release:
    name: qualify-release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Verify remediation and stage allowlists
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const h = JSON.parse(readFileSync('implementation-control/GITHUB_HANDOFF.json', 'utf8'));
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const prBody = event.pull_request?.body ?? '';
          const fail = (code, detail = '') => { throw new Error(`${code}${detail ? `:${detail}` : ''}`); };
          const changed = (a, b) => execFileSync('git', ['diff', '--name-only', a, b], { encoding: 'utf8' }).trim().split(/\r?\n/u).filter(Boolean);
          if (h.operation?.id !== 'b20-post-restore-control-plane-hardening') fail('UNEXPECTED_OPERATION');
          if (h.operation?.stage !== 'candidate') fail('UNEXPECTED_OPERATION_STAGE', h.operation?.stage);
          if (h.operation?.branch !== process.env.HEAD_BRANCH) fail('UNEXPECTED_OPERATION_BRANCH');
          if (h.release?.pending !== true || h.release?.authorizationStatus !== 'NOT_AUTHORIZED') fail('RELEASE_GATE_NOT_CLOSED');
          if (h.remediation?.hold !== true || h.productState?.b21Executable !== false || h.productState?.convergenceAuthorized !== false) fail('HOLD_OR_PRODUCT_GATE_INVALID');
          if (h.release?.releaseRevision !== 'v0.21.25_B20_completed_r3' || h.release?.zipName !== 'FS_v0.21.25_B20_completed_r3.zip') fail('R3_IDENTITY_INVALID');
          if (prBody.split(/\r?\n/u).some((line) => line.trim() === 'AUTHORIZE_B20_POST_RESTORE_CLOSURE_COMMIT')) fail('CLOSURE_LITERAL_PRESENT_DURING_CANDIDATE');
          const allAllowed = new Set(h.remediation?.allowedPaths ?? []);
          const full = changed(process.env.BASE_SHA, process.env.HEAD_SHA);
          const deniedFull = full.filter((path) => !allAllowed.has(path));
          if (deniedFull.length) fail('REMEDIATION_ALLOWLIST_VIOLATION', JSON.stringify(deniedFull));
          const prior = h.priorCandidateR2?.headSha;
          if (!/^[0-9a-f]{40}$/u.test(prior ?? '')) fail('R2_HEAD_INVALID', String(prior));
          execFileSync('git', ['merge-base', '--is-ancestor', prior, process.env.HEAD_SHA]);
          const stage = changed(prior, process.env.HEAD_SHA);
          const stageAllowed = new Set(h.remediation?.scopeExpansion?.allowedPaths ?? []);
          const deniedStage = stage.filter((path) => !stageAllowed.has(path));
          if (deniedStage.length) fail('CANDIDATE_SCOPE_EXPANSION_VIOLATION', JSON.stringify(deniedStage));
          const closure = h.remediation?.closurePolicy?.allowedPaths ?? [];
          if (closure.length !== 10 || closure.some((path) => !allAllowed.has(path))) fail('CLOSURE_ALLOWLIST_INVALID');
          console.log(JSON.stringify({ operation: h.operation.id, fullChangedPaths: full, stageChangedPaths: stage, mutation: false }, null, 2));
          NODE
      - name: Prepare qualification workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release .finscope-evidence/preflight
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Validate control plane
        run: node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Authenticate completed baseline Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-evidence/preflight/qualification-baseline.json
      - name: Generate exact-tree remediation candidate package r3
        run: node implementation-control/scripts/Package-GitHubCompletedRelease.mjs .finscope-release > .finscope-release/package.stdout.log 2> .finscope-release/package.stderr.log
      - name: Verify exact-tree remediation candidate package r3
        run: node implementation-control/scripts/Verify-GitHubCompletedPackage.mjs .finscope-release/FS_v0.21.25_B20_completed_r3.zip .finscope-release/FS_v0.21.25_B20_completed_r3.zip.sha256 > .finscope-release/verifier.stdout.log 2> .finscope-release/verifier.stderr.log
      - name: Upload read-only qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-release-qualification-${{ github.event.pull_request.head.sha }}
          path: |
            .finscope-release
            .finscope-evidence/preflight
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
