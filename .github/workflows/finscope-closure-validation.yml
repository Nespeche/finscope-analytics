name: FinScope Closure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finscope-remediation-closure-request.yml
      - .github/workflows/finscope-closure-validation.yml
      - README.md
      - START_HERE_CHATGPT.md
      - DOCUMENTATION_INDEX.md
      - V0.21_PHASE_STATUS.md
      - PACKAGE_METADATA.json
      - PACKAGE_INVENTORY.json
      - FILE_MANIFEST.sha256
      - PROMPT_IMPLEMENTACION_B21.md
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/IMPLEMENTATION_STATE.json
      - implementation-control/scripts/Apply-B20PostRestoreClosure.mjs
      - implementation-control/scripts/Verify-GitHubClosure.mjs
      - implementation-control/scripts/Verify-GitHubClosureArtifact.mjs


permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify-closure:
    name: verify-closure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Prepare normative package-root alias
        shell: bash
        run: |
          set -euo pipefail
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Validate control plane without mutation
        run: node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Verify B20 post-restore closure policy and exact-head artifacts
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubClosure.mjs
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.closure.outputs.artifact_name }}
          path: ${{ steps.closure.outputs.evidence_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Enforce closure result
        if: always()
        env:
          RESULT: ${{ steps.closure.outputs.result }}
        run: test "$RESULT" = PASS || test "$RESULT" = NOT_APPLICABLE
