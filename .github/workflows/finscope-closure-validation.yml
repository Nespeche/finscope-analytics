name: FinScope Closure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - implementation-control/GITHUB_HANDOFF.json

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  verify-closure:
    name: verify-closure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve fail-closed closure context outside checkout
        id: context
        shell: bash
        run: |
          set -euo pipefail
          context_dir="$RUNNER_TEMP/finscope-context"
          mkdir -p "$context_dir"
          node implementation-control/scripts/Resolve-GitHubContext.mjs "$GITHUB_HEAD_REF" --closure > "$context_dir/github-closure-context.json"
          closure_type="$(node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(value.closureType)' "$context_dir/github-closure-context.json")"
          case "$closure_type" in
            NOT_APPLICABLE|BATCH_CLOSURE|REMEDIATION_CLOSURE) ;;
            *) echo "CLOSURE_TYPE_INVALID:$closure_type" >&2; exit 1 ;;
          esac
          echo "closure_type=$closure_type" >> "$GITHUB_OUTPUT"
          echo "context_dir=$context_dir" >> "$GITHUB_OUTPUT"
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install closure validator dependencies
        run: npm ci --ignore-scripts
      - name: Dispatch authenticated closure payload when requested
        id: apply
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FINSCOPE_CLOSURE_CONTEXT_DIR: ${{ steps.context.outputs.context_dir }}
          CLOSURE_TYPE: ${{ steps.context.outputs.closure_type }}
        shell: bash
        run: |
          set +e
          case "$CLOSURE_TYPE" in
            BATCH_CLOSURE)
              node implementation-control/scripts/Apply-GitHubBatchClosure.mjs
              ;;
            REMEDIATION_CLOSURE)
              node implementation-control/scripts/Apply-GitHubRemediationClosure.mjs
              ;;
            NOT_APPLICABLE)
              echo "CLOSURE_NOT_REQUESTED"
              ;;
            *)
              echo "CLOSURE_TYPE_INVALID:$CLOSURE_TYPE" >&2
              exit 1
              ;;
          esac >"$FINSCOPE_CLOSURE_CONTEXT_DIR/apply.stdout.log" 2>"$FINSCOPE_CLOSURE_CONTEXT_DIR/apply.stderr.log"
          code=$?
          printf '%s\n' "$code" > "$FINSCOPE_CLOSURE_CONTEXT_DIR/apply.exit-code"
          cat "$FINSCOPE_CLOSURE_CONTEXT_DIR/apply.stdout.log"
          cat "$FINSCOPE_CLOSURE_CONTEXT_DIR/apply.stderr.log" >&2
          exit "$code"
      - name: Prepare normative package-root alias
        shell: bash
        run: |
          set -euo pipefail
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Validate control plane
        id: control
        run: node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Verify candidate identity, artifact and closure allowlist
        id: closure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINSCOPE_CLOSURE_TYPE: ${{ steps.context.outputs.closure_type }}
          FINSCOPE_CLOSURE_CONTEXT_DIR: ${{ steps.context.outputs.context_dir }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          CONTROL_PLANE_OUTCOME: ${{ steps.control.outcome }}
        run: node implementation-control/scripts/Verify-GitHubClosure.mjs
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.closure.outputs.artifact_name }}
          path: ${{ steps.closure.outputs.evidence_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Enforce closure result
        if: always()
        env:
          RESULT: ${{ steps.closure.outputs.result }}
        shell: bash
        run: |
          case "$RESULT" in
            PASS) echo "AUTHENTICATED_CLOSURE_PASS" ;;
            NOT_APPLICABLE) echo "CLOSURE_NOT_APPLICABLE" ;;
            *) echo "CLOSURE_FAILED:${RESULT:-missing}" >&2; exit 1 ;;
          esac
      - name: Clean resolver context
        if: always()
        run: rm -rf "$RUNNER_TEMP/finscope-context"
