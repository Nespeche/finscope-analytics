name: FinScope Completed Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finscope-closure-validation.yml
      - .github/workflows/finscope-completed-release.yml
      - .github/workflows/finscope-pr-validation.yml
      - .github/workflows/finscope-release-qualification.yml
      - V0.21_PHASE_STATUS.md
      - implementation-control/GITHUB_HANDOFF.json
      - implementation-control/scripts/Apply-GitHubBatchClosure.mjs
      - implementation-control/scripts/Package-GitHubCompletedRelease.mjs
      - implementation-control/scripts/Verify-GitHubCompletedPackage.mjs
      - implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - implementation-control/scripts/Run-GitHubReleaseTransfer.mjs
      - implementation-control/scripts/Resolve-GitHubContext.mjs

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Classify completed Release publication
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          handoff=implementation-control/GITHUB_HANDOFF.json
          operation_branch=$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.branch")
          context_dir="$RUNNER_TEMP/finscope-context"
          context_file="$context_dir/github-context.json"
          mkdir -p "$context_dir"
          node implementation-control/scripts/Resolve-GitHubContext.mjs \
            "$operation_branch" \
            --release-publication > "$context_file"
          enabled=$(node -p "JSON.parse(require('fs').readFileSync('$context_file')).enabled")
          reason=$(node -p "JSON.parse(require('fs').readFileSync('$context_file')).reason")
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if test "$enabled" != true; then
            echo "NOT_APPLICABLE: $reason"
          else
            echo "Release publication authority: $reason"
          fi
      - name: Configure Node from package authority
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          cache: npm
      - name: Prepare Release workspace
        if: steps.mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Verify Release gate, ancestry and remediation allowlist
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          handoff=implementation-control/GITHUB_HANDOFF.json
          closure=$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).closure.commitSha")
          candidate=$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).candidate.sha")
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).operation.kind")" = RELEASE_REMEDIATION
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).release.pending")" = true
          test "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).closure.status")" = COMPLETED
          test "$candidate" = "$(node -p "JSON.parse(require('fs').readFileSync('$handoff')).closure.candidateSha")"
          git cat-file -e "${closure}^{commit}"
          git merge-base --is-ancestor "$closure" "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF}')" -ge 3
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/finscope-closure-validation.yml|\
              .github/workflows/finscope-completed-release.yml|\
              .github/workflows/finscope-pr-validation.yml|\
              .github/workflows/finscope-release-qualification.yml|\
              V0.21_PHASE_STATUS.md|\
              implementation-control/GITHUB_HANDOFF.json|\
              implementation-control/scripts/Apply-GitHubBatchClosure.mjs|\
              implementation-control/scripts/Package-GitHubCompletedRelease.mjs|\
              implementation-control/scripts/Verify-GitHubCompletedPackage.mjs|\
              implementation-control/scripts/Verify-GitHubClosureArtifact.mjs|\
              implementation-control/scripts/Run-GitHubReleaseTransfer.mjs) ;;
              *) echo "Release remediation allowlist violation: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$closure" "$GITHUB_SHA")
          node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
          node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-release/release-baseline.json "$GITHUB_REF_NAME"
      - name: Execute literal Release qualification commands
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r encoded; do
            command=$(printf '%s' "$encoded" | base64 --decode)
            printf 'Executing literal qualification command: %s\n' "$command"
            bash -lc "$command"
          done < <(node -e "const h=require('./implementation-control/GITHUB_HANDOFF.json'); for (const item of h.operation.qualificationCommands.filter((entry)=>entry.required)) console.log(Buffer.from(item.command).toString('base64'))")
      - name: Authenticate closure artifact contents
        if: steps.mode.outputs.enabled == 'true'
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - name: Prepare authenticated draft Release and custom assets
        if: steps.mode.outputs.enabled == 'true'
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs prepare .finscope-release
      - name: Upload Release workflow evidence before publication
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-completed-release-${{ github.sha }}
          path: .finscope-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish authenticated completed Release
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs publish .finscope-release
      - name: Upload post-publication reauthentication evidence
        if: success() && steps.mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-post-publication-reauthentication-${{ github.sha }}-PASS
          path: |
            .finscope-release/POST_PUBLICATION_REAUTHENTICATION.json
            .finscope-release/POST_PUBLICATION_REAUTHENTICATION.md
            .finscope-release/post-publication-package-verification.stdout.log
            .finscope-release/post-publication-package-verification.stderr.log
          if-no-files-found: error
          retention-days: 30
      - name: Remove failed draft Release
        if: failure() && steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs cleanup .finscope-release
      - name: Upload failed Release evidence
        if: failure() && steps.mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-completed-release-${{ github.sha }}-_FAILED
          path: .finscope-release
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Clean resolver context
        if: always()
        run: rm -rf "$RUNNER_TEMP/finscope-context"
