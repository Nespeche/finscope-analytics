name: FinScope Completed Release

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact literal authorization for the B20 hardening tag/Release gate
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA authorized for publication
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: main
      - name: Enforce independent tag and Release authorization
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "AUTHORIZE_B20_POST_RESTORE_TAG_RELEASE"
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const handoff = JSON.parse(readFileSync('implementation-control/GITHUB_HANDOFF.json', 'utf8'));
          const assert = (value, code) => { if (!value) throw new Error(code); };
          assert(handoff.operation?.id === 'b20-post-restore-control-plane-hardening', 'UNEXPECTED_OPERATION');
          assert(handoff.operation?.kind === 'RELEASE_REMEDIATION', 'UNEXPECTED_OPERATION_KIND');
          assert(handoff.operation?.stage === 'release_authorized', 'RELEASE_STAGE_NOT_AUTHORIZED');
          assert(handoff.closure?.status === 'COMPLETED', 'CLOSURE_NOT_COMPLETED');
          assert(handoff.release?.pending === true, 'RELEASE_NOT_PENDING');
          assert(handoff.release?.authorizationStatus === 'AUTHORIZED', 'RELEASE_AUTHORIZATION_NOT_RECORDED');
          assert(handoff.remediation?.hold === true, 'RECOVERY_HOLD_MISSING');
          assert(handoff.release?.tag !== handoff.baseline?.tag, 'RELEASE_TAG_REUSES_COMPLETED_BASELINE');
          assert(handoff.release?.zipName !== handoff.baseline?.zipName, 'RELEASE_ZIP_REUSES_COMPLETED_BASELINE');
          assert(handoff.release?.sidecarName !== handoff.baseline?.sidecarName, 'RELEASE_SIDECAR_REUSES_COMPLETED_BASELINE');
          NODE
      - name: Configure Node from package authority
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Prepare Release workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Validate control plane and current baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
          node implementation-control/scripts/Verify-GitHubBaseline.mjs .finscope-release/release-baseline.json
      - name: Generate and verify exact authorized package
        shell: bash
        run: |
          set -euo pipefail
          node implementation-control/scripts/Package-GitHubCompletedRelease.mjs .finscope-release
          node implementation-control/scripts/Verify-GitHubCompletedPackage.mjs .finscope-release/FS_v0.21.25_B20_completed_r2.zip .finscope-release/FS_v0.21.25_B20_completed_r2.zip.sha256
      - name: Authenticate closure artifact contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Verify-GitHubClosureArtifact.mjs
      - name: Prepare authenticated draft Release and custom assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs prepare .finscope-release
      - name: Upload pre-publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-completed-release-${{ github.sha }}-PREPUBLICATION
          path: .finscope-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish authenticated completed Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs publish .finscope-release
      - name: Remove failed draft Release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_TAG: ${{ steps.draft.outputs.tag }}
        run: node implementation-control/scripts/Run-GitHubReleaseTransfer.mjs cleanup .finscope-release
      - name: Upload failed Release evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finscope-completed-release-${{ github.sha }}-_FAILED
          path: .finscope-release
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
