name: FinScope Completed Release

on:
  push:
    branches: [main]
    paths:
      - implementation-control/GITHUB_HANDOFF.json

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Configure Node from package authority
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
      - name: Prepare evidence and package-root alias
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .finscope-release
          root_alias="$RUNNER_TEMP/FinScope_v0.21.4"
          rm -rf "$root_alias"
          ln -s "$GITHUB_WORKSPACE" "$root_alias"
          echo "FINSCOPE_PACKAGE_ROOT=$root_alias" >> "$GITHUB_ENV"
      - name: Verify release gate and remediated tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pending=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.pending")
          status=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.status")
          closure=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.commitSha")
          test "$pending" = true
          test "$status" = COMPLETED
          test "$closure" = "09ed5099958fae3e8373db074e174e3c224523c2"
          test "$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF}')" -ge 3
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/finscope-completed-release.yml|\
              .github/workflows/finscope-release-qualification.yml|\
              implementation-control/GITHUB_HANDOFF.json|\
              implementation-control/scripts/Run-GitHubValidation.mjs|\
              implementation-control/scripts/Package-GitHubCompletedRelease.mjs|\
              implementation-control/scripts/Finalize-GitHubReleaseHandoff.mjs|\
              implementation-control/schemas/github-validation-evidence.schema.json) ;;
              *) echo "Release remediation allowlist violation: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$closure" "$GITHUB_SHA")
          node implementation-control/scripts/Validate-ControlPlaneState.mjs "$FINSCOPE_PACKAGE_ROOT"
      - name: Install dependencies for schema and regression validation
        run: npm ci
      - name: Run full non-product regression and build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test
          npm run build
      - name: Package completed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node implementation-control/scripts/Package-GitHubCompletedRelease.mjs .finscope-release
      - name: Authenticate explicit closure run and artifact
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          closure=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.commitSha")
          run_id=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.runId")
          artifact_id=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.artifactId")
          artifact_name=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.artifactName")
          artifact_digest=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).closure.artifactDigest")
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = "$closure"
          test "$(printf '%s' "$run_json" | jq -r .conclusion)" = success
          test "$(printf '%s' "$run_json" | jq -r .event)" = pull_request
          artifact_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")
          test "$(printf '%s' "$artifact_json" | jq -r .name)" = "$artifact_name"
          test "$(printf '%s' "$artifact_json" | jq -r .digest)" = "$artifact_digest"
          test "$(printf '%s' "$artifact_json" | jq -r .expired)" = false
          test "$(printf '%s' "$artifact_json" | jq -r .workflow_run.head_sha)" = "$closure"
          echo "closure_sha=$closure" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Create authenticated draft Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.tag")
          title=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.title")
          notes=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.notes")
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .draft)
            test "$draft" = true
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Generate and validate Release handoff
        run: node implementation-control/scripts/Finalize-GitHubReleaseHandoff.mjs .finscope-release "${{ steps.draft.outputs.release_id }}" "${{ steps.closure.outputs.closure_sha }}" "${{ steps.closure.outputs.run_id }}" "${{ steps.closure.outputs.artifact_id }}"
      - name: Upload custom assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.draft.outputs.tag }}"
          zip=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.zipName")
          sidecar=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.sidecarName")
          prefix=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.evidencePrefix")
          prompt=$(node -p "JSON.parse(require('fs').readFileSync('implementation-control/GITHUB_HANDOFF.json')).release.promptName")
          gh release upload "$tag" ".finscope-release/$zip" ".finscope-release/$sidecar" ".finscope-release/${prefix}_${GITHUB_RUN_ID}.json" .finscope-release/GITHUB_RELEASE_HANDOFF.json ".finscope-release/$prompt" --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft.outputs.release_id }}" -F draft=false >/dev/null
      - name: Upload Release workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finscope-completed-release-${{ github.sha }}
          path: .finscope-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
